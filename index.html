<title>You Will Never Leave IKEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Mono:wght@400;500&family=Jost:wght@400;500;600;800&display=swap">
<style>
/* layout: full-bleed WebGL store; HUD pinned to the screen edges like store signage and a paper list */
:root{
  --ink:#18202e;
  --paper:#f4efe3;
  --paper-edge:#d9d1bd;
  --yellow:#ffd43b;
  --navy:#1d3557;
  --pencil:#2f2c28;
  --red:#c4453a;
  --display:'Jost','Futura','Century Gothic','Avenir Next',sans-serif;
  --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --mono:'DM Mono','IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0d0f13;color:var(--paper);overflow:hidden;font-family:var(--display);}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
.hidden{display:none!important}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;align-items:flex-end;padding:0 max(16px,6vw) 8vh;
  background:linear-gradient(90deg,rgba(13,15,19,.82) 0%,rgba(13,15,19,.55) 38%,rgba(13,15,19,0) 70%),
             linear-gradient(0deg,rgba(13,15,19,.65) 0%,rgba(13,15,19,0) 45%);
  transition:opacity 1.2s ease;}
#title.gone{opacity:0;pointer-events:none}
.t-wrap{max-width:720px;display:grid;gap:22px}
.t-kicker{font-weight:500;letter-spacing:.32em;text-transform:uppercase;font-size:13px;color:var(--yellow)}
.t-name{margin:0;line-height:.86;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.t-name .a{display:block;font-size:clamp(28px,4.2vw,58px);font-weight:500;letter-spacing:-.01em}
.t-name .b{display:block;font-size:clamp(64px,11vw,168px)}
.t-name .b em{font-style:normal;color:var(--yellow)}
.t-hand{font-family:var(--hand);font-size:clamp(26px,2.6vw,36px);color:#efe6cf;transform:rotate(-2deg);transform-origin:left;margin:0}
.t-row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
#enter{position:relative;font:600 18px var(--display);letter-spacing:.04em;color:var(--ink);background:var(--yellow);
  border:0;padding:16px 30px 16px 46px;cursor:pointer;clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%);transition:transform .2s ease,filter .2s}
#enter::before{content:"";position:absolute;left:20px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#0d0f13}
#enter:hover{transform:translateX(4px)}
#enter:focus-visible{outline:3px solid #fff;outline-offset:4px}
#enter[disabled]{filter:grayscale(1) brightness(.7);cursor:progress}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;color:#cfc8b8;letter-spacing:.02em}
.keys b{font:500 12px var(--mono);color:var(--paper);background:rgba(255,255,255,.1);padding:2px 7px;border-radius:3px;justify-self:end}
.t-found{font:400 12px var(--mono);color:#9a937f;letter-spacing:.05em}

/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#reticle{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .15s}
#reticle.on{transform:scale(2.2);background:var(--yellow)}
#prompt{position:absolute;left:50%;bottom:17vh;transform:translateX(-50%);text-align:center;max-width:min(560px,86vw);
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.6);transition:opacity .2s}
#prompt .p1{font-weight:600;font-size:19px;display:flex;gap:10px;align-items:center;justify-content:center}
#prompt .k{font:500 13px var(--mono);background:var(--paper);color:var(--ink);padding:2px 8px;border-radius:3px;text-shadow:none;box-shadow:0 2px 0 #9b927c}
#prompt .p2{font-size:15px;margin-top:6px;color:#efe8d8;font-style:italic;line-height:1.35}
#thought{position:absolute;left:max(24px,4vw);top:9vh;max-width:min(520px,80vw);font-family:var(--hand);font-size:clamp(26px,2.4vw,34px);line-height:1.1;color:#fffaf0;
  text-shadow:0 2px 3px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:opacity .8s,transform .8s}
#thought.on{opacity:1;transform:none}
#pa{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;gap:12px;align-items:baseline;max-width:min(760px,90vw);opacity:0;transition:opacity .6s}
#pa.on{opacity:1}
#pa .tag{font:600 11px var(--display);letter-spacing:.18em;background:var(--yellow);color:var(--ink);padding:3px 7px;flex:none}
#pa .txt{font-size:16px;line-height:1.35;color:#fff;text-shadow:0 1px 3px #000,0 0 14px rgba(0,0,0,.7)}
#status{position:absolute;left:max(20px,3vw);bottom:max(18px,3vh);display:grid;gap:4px;font-family:var(--hand);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#status .lbl{font-size:24px;line-height:1}
#bar{width:180px;height:12px;position:relative}
#bar svg{position:absolute;inset:0;overflow:visible}
#bag{font-size:22px}
#hint{position:absolute;right:max(20px,3vw);bottom:max(18px,3vh);font:500 12px var(--mono);color:rgba(255,255,255,.7);text-shadow:0 1px 2px #000;letter-spacing:.04em}

/* paper list */
#list{position:absolute;right:max(24px,4vw);top:50%;width:330px;max-width:80vw;transform:translate(120%,-50%) rotate(4deg);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:var(--paper);color:var(--pencil);padding:26px 26px 30px;font-family:var(--hand);font-size:26px;line-height:1.15;
  box-shadow:0 18px 40px rgba(0,0,0,.45);background-image:repeating-linear-gradient(0deg,transparent 0 33px,rgba(36,74,143,.16) 33px 34px);border-top:6px solid var(--paper-edge)}
#list.on{transform:translate(0,-50%) rotate(1.5deg)}
#list h3{margin:0 0 6px;font:600 12px var(--display);letter-spacing:.24em;text-transform:uppercase;color:#7b735f}
#list ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#list li{position:relative;padding-left:26px}
#list li::before{content:"";position:absolute;left:0;top:10px;width:13px;height:13px;border:2px solid var(--pencil);border-radius:2px;transform:rotate(-4deg)}
#list li.done::after{content:"";position:absolute;left:2px;top:6px;width:10px;height:17px;border:solid var(--red);border-width:0 3px 3px 0;transform:rotate(40deg)}
#list li.struck span{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
#list .note{color:var(--navy);font-size:24px;display:block;margin-top:2px}
#list .sm{font-size:21px;color:#6b6352}
#list svg{display:block;margin:4px 0 0 4px}

/* fades + messages */
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;pointer-events:none;padding:0 max(16px,8vw);opacity:0;transition:opacity 1s}
#msg.on{opacity:1}
#msg .m1{font-weight:800;font-size:clamp(30px,4vw,54px);letter-spacing:-.01em;text-wrap:balance}
#msg .m2{font-family:var(--hand);font-size:clamp(24px,2.3vw,32px);color:#eadfc6;max-width:640px}

#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,15,19,.55);backdrop-filter:blur(3px)}
#pause div{text-align:center;display:grid;gap:10px}
#pause b{font-weight:800;font-size:34px}
#pause span{font-family:var(--hand);font-size:26px;color:#e6dcc4}

/* ending */
#ending{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;padding:6vh max(16px,5vw);background:rgba(244,239,227,.0);transition:background 2.5s;pointer-events:none;opacity:0}
#ending.on{pointer-events:auto;opacity:1;background:rgba(13,15,19,.72)}
#ending.day.on{background:rgba(250,248,240,.55)}
.e-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,300px);gap:min(6vw,72px);align-items:center;max-width:1050px;width:100%}
@media (max-width:760px){.e-grid{grid-template-columns:1fr}}
.e-num{font:500 12px var(--mono);letter-spacing:.2em;color:var(--yellow)}
#ending.day .e-num{color:#9a6b00}
.e-title{font-weight:800;font-size:clamp(40px,6.5vw,92px);line-height:.9;letter-spacing:-.02em;margin:10px 0 18px;text-wrap:balance}
#ending.day .e-title,#ending.day .e-body{color:var(--ink);text-shadow:none}
.e-body{font-size:clamp(17px,1.5vw,20px);line-height:1.5;max-width:56ch;color:#efe8d8;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.e-actions{margin-top:26px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#again{font:600 16px var(--display);background:var(--yellow);color:var(--ink);border:0;padding:13px 24px;cursor:pointer}
#again:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.e-found{font:400 12px var(--mono);color:#a59e8a}
#ending.day .e-found{color:#6b6352}
.receipt{background:#fbfaf6;color:#222;font:400 13px/1.55 var(--mono);padding:22px 20px 30px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:rotate(1.2deg);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x}
.receipt .hd{text-align:center;font-weight:500;letter-spacing:.15em;margin-bottom:10px}
.receipt .ln{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .ft{text-align:center;margin-top:12px;font-size:12px;color:#555}
#loadnote{font:400 12px var(--mono);color:#a59e8a;letter-spacing:.05em}
@media (prefers-reduced-motion:reduce){#list,#thought,#title,#msg{transition:none}}
</style>

<canvas id="c"></canvas>

<div id="title">
  <div class="t-wrap">
    <div class="t-kicker">A Saturday, in first person</div>
    <h1 class="t-name"><span class="a">You will never</span><span class="b">leave <em>IKEA</em></span></h1>
    <p class="t-hand">you only need a lamp.</p>
    <div class="t-row">
      <button id="enter" disabled>Unfolding the store…</button>
      <div class="keys">
        <b>W A S D</b><span>walk</span>
        <b>mouse</b><span>look around</span>
        <b>shift</b><span>hurry (costs patience)</span>
        <b>E</b><span>take · sit · read</span>
        <b>Q</b><span>your shopping list</span>
      </div>
    </div>
    <div class="t-found" id="found"></div>
    <div id="loadnote"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="reticle"></div>
  <div id="thought"></div>
  <div id="prompt"></div>
  <div id="pa"><span class="tag">PA</span><span class="txt"></span></div>
  <div id="status">
    <span class="lbl">patience</span>
    <div id="bar"><svg viewBox="0 0 180 12" preserveAspectRatio="none"><path d="M2 7 Q 45 3 90 6 T 178 5" stroke="rgba(255,255,255,.25)" stroke-width="7" fill="none" stroke-linecap="round"/><path id="barfill" d="M2 7 Q 45 3 90 6 T 178 5" stroke="#ffd43b" stroke-width="7" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100"/></svg></div>
    <span id="bag">bag: empty</span>
  </div>
  <div id="hint">Q list · M sound</div>
  <div id="list">
    <h3>Saturday</h3>
    <ul id="listItems"></ul>
  </div>
</div>

<div id="msg"><div class="m1"></div><div class="m2"></div></div>
<div id="pause" class="hidden"><div><b>Paused</b><span>click to keep shopping</span></div></div>

<div id="ending">
  <div class="e-grid">
    <div>
      <div class="e-num" id="eNum"></div>
      <h2 class="e-title" id="eTitle"></h2>
      <div class="e-body" id="eBody"></div>
      <div class="e-actions"><button id="again">Go back in</button><span class="e-found" id="eFound"></span></div>
    </div>
    <div class="receipt" id="receipt"></div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   utilities
   ========================================================= */
const $ = s => document.querySelector(s);
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(19431943);
const R = (a = 1, b) => b === undefined ? rng() * a : a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const WHITE = new THREE.Color(1, 1, 1), _c = new THREE.Color();
function tint(hex, k) { const c = new THREE.Color(hex); if (k > 0) c.lerp(WHITE, k); else c.multiplyScalar(1 + k); return c; }
const FONT = "Jost, Futura, 'Century Gothic', 'Avenir Next', sans-serif";
const HAND = "Caveat, 'Bradley Hand', 'Segoe Print', cursive";
const price = n => `${n.toLocaleString('sv-SE')},–`;
const aoK = y => 0.5 + 0.5 * smooth(0, 1.6, y);

/* =========================================================
   geometry builder: everything static is merged by material
   ========================================================= */
const COLL = [];   // axis aligned colliders {x0,x1,z0,z1}
const BLOBS = [];  // contact shadows {x,z,w,d,zone}
class Builder {
  constructor(zone) { this.zone = zone; this.geos = {}; this.counts = {}; this.m = new THREE.Matrix4(); this.stack = []; this.chunk = 0; }
  frame(x, z, ry = 0) { this.stack.length = 0; this.m.makeRotationY(ry); this.m.setPosition(x, 0, z); }
  reset() { this.stack.length = 0; this.m.identity(); }
  push(x, z, ry = 0, y = 0) { this.stack.push(this.m.clone()); const t = new THREE.Matrix4().makeRotationY(ry); t.setPosition(x, y, z); this.m.multiply(t); }
  pop() { this.m = this.stack.pop(); }
  add(g, color, o = {}) {
    if (g.index) g = g.toNonIndexed();
    g.applyMatrix4(this.m);
    const key = (o.key || 'matte') + '|' + (o.chunk ?? this.chunk);
    const pos = g.attributes.position, n = pos.count, arr = new Float32Array(n * 3);
    _c.set(color); const ao = o.ao !== false;
    for (let i = 0; i < n; i++) { const k = ao ? aoK(pos.getY(i)) : 1; arr[i * 3] = _c.r * k; arr[i * 3 + 1] = _c.g * k; arr[i * 3 + 2] = _c.b * k; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    const start = this.counts[key] || 0; this.counts[key] = start + n;
    (this.geos[key] ||= []).push(g);
    return { key, start, count: n };
  }
  box(x, y, z, w, h, d, c, o = {}) { const g = new THREE.BoxGeometry(w, h, d); rot(g, o); g.translate(x, y, z); return this.add(g, c, o); }
  bx(x, y, z, w, h, d, c, o) { return this.box(x, y + h / 2, z, w, h, d, c, o); }
  cyl(x, y, z, rt, rb, h, c, o = {}) { const g = new THREE.CylinderGeometry(rt, rb, h, o.seg || 12, 1, !!o.open); rot(g, o); g.translate(x, y + h / 2, z); return this.add(g, c, o); }
  sph(x, y, z, r, c, o = {}) { const g = new THREE.SphereGeometry(r, o.ws || 10, o.hs || 7, 0, TAU, 0, o.tl || PI); if (o.s) g.scale(...o.s); rot(g, o); g.translate(x, y, z); return this.add(g, c, o); }
  ico(x, y, z, r, c, o = {}) { const g = new THREE.IcosahedronGeometry(r, o.detail ?? 0); if (o.s) g.scale(...o.s); rot(g, o); g.translate(x, y, z); return this.add(g, c, o); }
  cone(x, y, z, r, h, c, o = {}) { const g = new THREE.ConeGeometry(r, h, o.seg || 12, 1, !!o.open); rot(g, o); g.translate(x, y + h / 2, z); return this.add(g, c, o); }
  plane(x, y, z, w, h, c, o = {}) {
    const g = new THREE.PlaneGeometry(w, h);
    const uv = g.attributes.uv;
    if (o.uv) { const [u0, v0, u1, v1] = o.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, lerp(u0, u1, uv.getX(i)), lerp(v0, v1, uv.getY(i))); }
    else if (o.rep) for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * o.rep[0], uv.getY(i) * o.rep[1]);
    rot(g, o); g.translate(x, y, z); return this.add(g, c, o);
  }
  wp(x, y, z) { return new THREE.Vector3(x, y, z).applyMatrix4(this.m); }
  wyaw(lx = 0, lz = 1) { const d = new THREE.Vector3(lx, 0, lz).transformDirection(this.m); return Math.atan2(-d.x, -d.z); }
  aabb(x, z, w, d) {
    const p = [[x - w / 2, z - d / 2], [x + w / 2, z - d / 2], [x - w / 2, z + d / 2], [x + w / 2, z + d / 2]].map(([a, b]) => new THREE.Vector3(a, 0, b).applyMatrix4(this.m));
    return { x0: Math.min(...p.map(v => v.x)), x1: Math.max(...p.map(v => v.x)), z0: Math.min(...p.map(v => v.z)), z1: Math.max(...p.map(v => v.z)) };
  }
  collide(x, z, w, d) { const b = this.aabb(x, z, w, d); COLL.push(b); return b; }
  foot(x, z, w, d, coll = true) { const b = coll ? this.collide(x, z, w, d) : this.aabb(x, z, w, d); BLOBS.push({ x: (b.x0 + b.x1) / 2, z: (b.z0 + b.z1) / 2, w: b.x1 - b.x0, d: b.z1 - b.z0, zone: this.zone }); }
  build(mats, parent) {
    const meshes = {};
    for (const key in this.geos) {
      const mk = key.split('|')[0];
      const geo = mergeGeometries(this.geos[key], false);
      this.geos[key].forEach(g => g.dispose());
      const mesh = new THREE.Mesh(geo, mats[mk]);
      mesh.matrixAutoUpdate = false; parent.add(mesh); meshes[key] = mesh;

}
function rot(g, o) { if (o.rx) g.rotateX(o.rx); if (o.rz) g.rotateZ(o.rz); if (o.ry) g.rotateY(o.ry); }

/* collision grid */
const GS = 4; let GRID = new Map(); let stamp = 0;
function buildGrid() {
  GRID = new Map();
  COLL.forEach(b => {
    b.s = 0;
    for (let gx = Math.floor(b.x0 / GS); gx <= Math.floor(b.x1 / GS); gx++)
      for (let gz = Math.floor(b.z0 / GS); gz <= Math.floor(b.z1 / GS); gz++) {
        const k = gx * 100003 + gz; if (!GRID.has(k)) GRID.set(k, []); GRID.get(k).push(b);
      }
  });
}
function collidePlayer(p, r) {
  for (let it = 0; it < 2; it++) {
    stamp++;
    const gx = Math.floor(p.x / GS), gz = Math.floor(p.z / GS);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const list = GRID.get((gx + dx) * 100003 + gz + dz); if (!list) continue;
      for (const b of list) {
        if (b.s === stamp || b.off) continue; b.s = stamp;
        const cx = clamp(p.x, b.x0, b.x1), cz = clamp(p.z, b.z0, b.z1);
        const ddx = p.x - cx, ddz = p.z - cz, d2 = ddx * ddx + ddz * ddz;
        if (d2 >= r * r) continue;
        if (d2 > 1e-9) { const d = Math.sqrt(d2); p.x += ddx / d * (r - d); p.z += ddz / d * (r - d); }
        else {
          const l = p.x - b.x0 + r, rr = b.x1 - p.x + r, t = p.z - b.z0 + r, bt = b.z1 - p.z + r, m = Math.min(l, rr, t, bt);
          if (m === l) p.x = b.x0 - r; else if (m === rr) p.x = b.x1 + r; else if (m === t) p.z = b.z0 - r; else p.z = b.z1 + r;
        }
      }
    }
  }

    this.c = document.createElement('canvas'); this.c.width = this.c.height = size; this.ctx = this.c.getContext('2d');
    this.ctx.fillStyle = '#888'; this.ctx.fillRect(0, 0, size, size);
  }
  alloc(nw, nh, draw) {
    for (let r = 0; r <= this.rows - nh; r++) for (let c = 0; c <= this.cols - nw; c++) {
      let ok = true;
      for (let y = 0; y < nh && ok; y++) for (let x = 0; x < nw && ok; x++) if (this.occ[(r + y) * this.cols + c + x]) ok = false;
      if (!ok) continue;
      for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) this.occ[(r + y) * this.cols + c + x] = 1;
      const px = c * this.cw, py = r * this.ch, w = nw * this.cw, h = nh * this.ch, pad = 3;

      const S = this.S;
      return [(px + pad) / S, 1 - (py + h - pad) / S, (px + w - pad) / S, 1 - (py + pad) / S];
    }

}

/* =========================================================
   SHOWROOM
   ========================================================= */
function buildShowroom() {
  const b = new Builder('showroom');
  const atlas = new Atlas();
  const roomAt = {};
  let storyI = 0;

  // rooms: decide facing + type
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
    const ch = cell(c, r); if (!isRoom(ch)) continue;
    const cands = [[0, -1], [0, 1], [-1, 0], [1, 0]].filter(([dc, dr]) => { const n = cell(c + dc, r + dr); return n === '.' || n === 'A'; });
    let f = cands.length > 1 ? pick(cands) : cands[0];
    if (ch === 'L') f = [0, -1];
    const pathRow = r + f[1];
    let type = pick(ROW_TYPES[pathRow] || ['living']);
    if (ch === 'B') type = 'bedroom';
    if (ch === 'L') type = 'living';
    const rotY = Math.atan2(f[0], f[1]);
    const bold = rng() < .14;
    const st = STORIES[storyI++ % STORIES.length];
    const room = { c, r, ch, type, face: f, cx: cc(c), cz: cc(r), rot: rotY, wallCol: bold ? pick(PAL.bold) : pick(PAL.walls), spots: [], wallRanges: [], story: st[0], m2: st[1], lamp: ch === 'L' };
    roomAt[c + ',' + r] = room; ROOMS.push(room);
  }

  // floors
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
    const ch = cell(c, r); if (ch === '#') continue; b.chunk = r;
    if (ch === 'Z') { b.plane(cc(c) - 2, 0, cc(r), 2, C, '#ffffff', { rx: -PI / 2, key: 'path', rep: [.66, 2], ao: false }); continue; }
    b.plane(cc(c), 0, cc(r), C, C, '#ffffff', { rx: -PI / 2, key: 'path', rep: [2, 2], ao: false });
  }
  // ceiling
  b.chunk = 99;
  b.plane(GW * C / 2, CEIL, GH * C / 2, GW * C, GH * C, '#4b4d52', { rx: PI / 2, ao: false });
  for (let r = 2; r <= 10; r += 2) { b.cyl(C, 4.55, cc(r) - 1.6, .28, .28, (GW - 2) * C, '#a9adb2', { rz: PI / 2, seg: 14, key: 'metal' }); }
  for (let r = 1; r < GH; r += 2) b.box(GW * C / 2, 4.85, r * C + C, (GW - 2) * C, .12, .08, '#2f3134');

  // walls
  const sideCol = (c, r) => { const ch = cell(c, r); if (isRoom(ch)) return roomAt[c + ',' + r].wallCol; if (ch === 's') return '#e4e1da'; return '#efeee9'; };
  const isOpen = (c1, r1, c2, r2) => {
    const a = cell(c1, r1), z = cell(c2, r2);
    if (isPath(a) && isPath(z)) return true;
    if (isRoom(a)) { const rm = roomAt[c1 + ',' + r1]; if (c1 + rm.face[0] === c2 && r1 + rm.face[1] === r2) return true; }
    if (isRoom(z)) { const rm = roomAt[c2 + ',' + r2]; if (c2 + rm.face[0] === c1 && r2 + rm.face[1] === r1) return true; }
    if ((a === 's' && isPath(z) || z === 's' && isPath(a)) && c1 === c2) return true;
    return false;
  };
  const slab = (c, r, x, z, w, d, h, roomSide) => {
    if (cell(c, r) === '#') return;
    b.chunk = r;
    const rr = b.bx(x, 0, z, w, h, d, sideCol(c, r), { key: 'walls' });
    if (roomSide && isRoom(cell(c, r))) roomAt[c + ',' + r].wallRanges.push(rr);
  };
  const posterUV = POSTERS.map(fn => atlas.alloc(2, 3, fn));
  const poster = (row, x, z, ry, alongX) => {
    if (rng() > .3) return;
    const off = R(-1.6, 1.6); const px = alongX ? x + off : x, pz = alongX ? z : z + off;
    b.chunk = row; b.push(px, pz, ry);
    b.box(0, 1.55, -.01, 1.0, 1.42, .02, '#1f1f1f');
    b.plane(0, 1.55, .002, .95, 1.37, '#fff', { key: 'atlas', uv: pick(posterUV), ao: false });
    b.pop();
  };
  for (let r = 0; r < GH; r++) for (let c = 0; c < GW; c++) {
    for (const [dc, dr] of [[1, 0], [0, 1]]) {
      const c2 = c + dc, r2 = r + dr; if (c2 >= GW || r2 >= GH) continue;
      const a = cell(c, r), z = cell(c2, r2); if (a === '#' && z === '#') continue;
      const border = a === '#' || z === '#';
      const h = border ? CEIL : WALL_H;
      if (dc) { // vertical edge at x
        const x = c2 * C, z0 = cc(r);
        if (isOpen(c, r, c2, r2)) {

          if (rm) for (const s of [-1, 1]) { b.chunk = r; b.bx(x, 0, z0 + s * (C / 2 - .25), .2, WALL_H, .5, '#efeee9', { key: 'walls' }); b.collide(x, z0 + s * (C / 2 - .25), .2, .5); }
          continue;
        }
        slab(c, r, x - .045, z0, .09, C + .09, h, true); slab(c2, r2, x + .045, z0, .09, C + .09, h, true);
        if (!border) { if (cell(c, r) === '.') poster(r, x - .1, z0, -PI / 2); if (cell(c2, r2) === '.') poster(r2, x + .1, z0, PI / 2); }
        COLL.push({ x0: x - .1, x1: x + .1, z0: r * C, z1: r * C + C });
      } else {
        const z = r2 * C, x0 = cc(c);

    for (const s of [-1, 1]) { b.bx(x + s * 1.15, 0, z, .12, WALL_H, C, '#dedbd3', { key: 'walls' }); COLL.push({ x0: x + s * 1.15 - .08, x1: x + s * 1.15 + .08, z0: z - C / 2, z1: z + C / 2 }); }
    for (const e of [-1, 1]) for (const s of [-1, 1]) { const bx = x + s * 2.07; b.bx(bx, 0, z + e * (C / 2 - .06), 1.85, WALL_H, .12, '#efeee9', { key: 'walls' }); b.collide(bx, z + e * (C / 2 - .06), 1.85, .14); }

    for (const e of [-1, 1]) b.bx(x, 2.3, z + e * (C / 2 - .06), 2.3, .6, .12, '#efeee9', { key: 'walls' });
    const uv = atlas.alloc(2, 1, (ctx, w, h) => { ctx.fillStyle = '#1d3557'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#ffd43b'; ctx.fillRect(0, h - 14, w, 14); ctx.fillStyle = '#fff'; fit(ctx, 'GENVÄG', w - 120, 62, 800); ctx.textBaseline = 'middle'; ctx.fillText('GENVÄG', 24, h * .38); ctx.font = `500 22px ${FONT}`; ctx.fillText('Shortcut', 26, h * .74); ctx.beginPath(); ctx.moveTo(w - 70, 26); ctx.lineTo(w - 40, 26); ctx.lineTo(w - 40, 62); ctx.lineTo(w - 24, 62); ctx.lineTo(w - 55, 100); ctx.lineTo(w - 86, 62); ctx.lineTo(w - 70, 62); ctx.closePath(); ctx.fill(); });
    b.plane(x, 2.6, z - C / 2 - .01, 1.3, .32, '#fff', { ry: PI, key: 'atlas', uv, ao: false });
    SHORT.push({ c, r, x, z, order: DIST[c + ',' + (r - 1)], uses: 0 });
  }

  // rooms content + placards

    ROOM_FN[room.type](b, room);
    if (room.lamp) buildGlöda(b, room);
    b.box(0, 4.95, -1, 1.4, .05, .4, '#fff4e0', { key: 'panel' });
    // placard
    b.push(2.35, 2.55, -.35);
    b.cyl(0, 0, 0, .14, .16, .03, '#2b2b2b', { seg: 14 }); b.cyl(0, 0, 0, .012, .012, 1.15, '#2b2b2b', { seg: 5 });
    const [sw, en] = TYPE_TITLE[room.type];
    const total = 2000 + Math.round(R(4, 30)) * 500 - 1;
    room.total = total;
    const uv = atlas.alloc(2, 2, (ctx, w, h) => {
      ctx.fillStyle = '#fbfaf6'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#ffd43b'; ctx.fillRect(0, 0, w, 16);
      ctx.fillStyle = '#18202e'; ctx.textBaseline = 'alphabetic';
      ctx.font = `800 56px ${FONT}`; ctx.fillText(sw.toUpperCase(), 26, 86);

    // items

  // start area: stand with lists, pencils, bags + sign
  {
    b.chunk = 2; b.frame(cc(1) - .2, cc(2) - 1.9, 0);
    b.bx(0, 0, 0, 1.2, .9, .5, '#1d3557'); b.bx(0, .9, 0, 1.25, .04, .55, '#efeae2'); b.collide(0, 0, 1.25, .55);
    for (let i = 0; i < 12; i++) b.bx(R(-.5, .5), .94, R(-.2, .2), .006, .006, .09, '#d8b46a', { ry: R(TAU) });
    b.bx(-.25, .94, 0, .3, .02, .21, '#f6f3ea'); b.bx(.3, .94, 0, .35, .25, .2, '#f2c230'); b.bx(.3, 1.19, -.08, .3, .02, .02, '#2b4f9e');
    const uv = atlas.alloc(4, 2, (ctx, w, h) => { ctx.fillStyle = '#ffd43b'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#18202e'; ctx.font = `800 112px ${FONT}`; ctx.fillText('START', 34, 140); ctx.font = `500 38px ${FONT}`; ctx.fillText('Follow the arrows · Följ pilarna', 38, 214); });
    b.bx(0, 0, -.1, .05, 2.6, .05, '#2b2b2b'); b.box(0, 2.6, -.1, 1.6, .8, .04, '#ffd43b'); b.plane(0, 2.6, -.075, 1.56, .78, '#fff', { key: 'atlas', uv, ao: false });

function interact() {

  const it = currentInter; if (!it) return;
  if (it.kind === 'item') {
    const item = it.item; item.taken = true; item.g.visible = false; item.halo.visible = false; it.gone = true;
    P.items.push(item.def); addToBag(item.def); AUD.pickup();
    P.resolve = Math.min(100, P.resolve + 6);
    const n = P.items.length;
    if (n === 1) think(`Well. It was only ${price(item.def.price)}`);
    else if (n === 3) think('This is fine. These are things I need.');
    else if (n === 6) think('The bag is getting heavy. That is the bag\'s problem.');
    else if (n === 9) think('I am not a person who needs this many things. And yet.');

  } else if (it.kind === 'sit') { sitDown(it.sit); }
  else if (it.kind === 'tag') {

  }

let currentInter = null;
const _v = new THREE.Vector3(), _dir = new THREE.Vector3();
function findInteract() {
  camera.getWorldDirection(_dir); const cp = camera.position; let best = null, bt = 1e9;
  for (const it of INTER) {

    if (it.kind === 'staff' && false) continue;
    _v.subVectors(it.pos, cp); const t = _v.dot(_dir); if (t < 0 || t > it.reach) continue;
    const d2 = _v.lengthSq() - t * t; if (d2 > it.r * it.r) continue;

/* temptation: items call to you */
let callLevel = 0;
function updateTemptation(dt) {
  camera.getWorldDirection(_dir); const cp = camera.position; let strongest = null, sv = 0;
  for (const it of ITEMS) {
    if (it.taken || it.zone !== P.zone) { it.halo.visible = false; continue; }
    _v.subVectors(it.pos, cp); const d = _v.length();
    if (d > 6) { it.halo.visible = false; it.call = 0; continue; }
    const cos = _v.dot(_dir) / d;
    const target = (1 - d / 6) * smooth(.55, .97, cos);
    it.call = lerp(it.call, target, 1 - Math.exp(-dt * 4));
    it.halo.visible = it.call > .01;
    const pulse = .75 + .25 * Math.sin(gameTime * 3.2 + it.pos.x);
    it.halo.material.opacity = it.call * .75 * pulse; it.halo.scale.setScalar(.55 + it.call * .7);
    if (it.call > sv) { sv = it.call; strongest = it; }
  }

  if (strongest && sv > .25 && !P.sitting && Math.abs(mouseDX) < 2) {
    _v.subVectors(strongest.pos, cp);
    const want = Math.atan2(-_v.x, -_v.z); let dy = want - P.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));

}

/* shortcuts that are not shortcuts */
function updateShortcuts() {
  if (P.zone !== 'showroom') return;
  for (const s of SR.SHORT) {
    const inX = Math.abs(P.pos.x - s.x) < 1.2, dz = P.pos.z - s.z;
    if (!inX || Math.abs(dz) > C / 2) { s.prev = undefined; continue; }
    if (s.prev !== undefined && s.prev < 0 && dz >= 0) {
      s.uses++;
      const earlier = SR.SHORT.filter(o => o.order < s.order);
      flags.shortUses = (flags.shortUses || 0) + 1;
      let fake = false;
      if (earlier.length) fake = flags.shortUses === 2 ? true : Math.random() < .35 + .45 * uncanny;
      if (fake) {
        const dst = pick(earlier);
        const ox = P.pos.x - s.x, oz = P.pos.z - s.z;
        P.pos.set(dst.x - ox, 0, dst.z - oz); P.yaw += PI; P.vel.multiplyScalar(-1);
        dst.prev = P.pos.z - dst.z; s.prev = undefined;
        P.loops++; P.resolve -= 9; AUD.skip();
        setTimeout(() => think(P.loops === 1 ? '…Haven\'t I been here before?' : P.loops === 2 ? 'The arrows were right. The arrows are always right.' : pick(['Again.', 'This is the same corridor. It can\'t be.', 'I am going to follow the arrows now.', 'Of course.'])), 1400);
        return;
      }

}

/* the store shifts when you're not looking */
let shiftTimer = 6;

  shiftTimer = 7 - uncanny * 4;

  if (uncanny > .22) {
    const cands = ROOMS.filter(r => { _v.set(r.cx - camera.position.x, 0, r.cz - camera.position.z); const d = _v.length(); return d > 9 && d < 34 && _v.dot(_dir) / d < -.35; });

      const col = new THREE.Color(uncanny > .6 && rng() < .35 ? pick(['#7a1f1f', '#1f2f7a', '#e0d84a', '#111111']) : pick(PAL.walls.concat(PAL.bold)));

        ca.needsUpdate = true;

}

/* patience */
function updateResolve(dt, moving, hurry) {
  if (P.sitting) { P.sitT += dt; P.resolve = Math.min(100, P.resolve + 7 * dt); P.gameMin += dt * 9; return; }
  let rate = P.zone === 'warehouse' ? .2 : .16;
  if (hurry && moving) rate *= 2.6; if (!moving) rate *= .55;
  P.resolve -= rate * dt; P.gameMin += dt * .35;
  if (P.resolve < 45) think('My feet hurt. I could sit on one of these sofas for a minute.', 'feet');
  if (P.resolve < 22) think('What day is it?', 'day');
  if (P.resolve <= 0 && !transitioning) liveHere();
}
function liveHere() {

/* =========================================================
   per-frame player
   ========================================================= */
function updatePlayer(dt) {
  const sens = .0022;
  P.yaw -= mouseDX * sens; P.pitch = clamp(P.pitch - mouseDY * sens, -1.35, 1.35); mouseDX = mouseDY = 0;
  if (P.wake > 0) { P.wake -= dt; P.pitch = lerp(P.pitch, 0, 1 - Math.exp(-dt * .9)); }
  const fwd = new THREE.Vector3(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)), right = new THREE.Vector3(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  const inp = new THREE.Vector3();
  if (!P.locked && !P.sitting) {
    if (keys.KeyW || keys.ArrowUp) inp.add(fwd); if (keys.KeyS || keys.ArrowDown) inp.sub(fwd);
    if (keys.KeyD || keys.ArrowRight) inp.add(right); if (keys.KeyA || keys.ArrowLeft) inp.sub(right);
  }
  if (P.sitting && (keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD) && P.sitT > .6) standUp();
  const hurry = keys.ShiftLeft || keys.ShiftRight;
  const weight = clamp(1 - P.items.length * .045 - (P.hasLamp ? .12 : 0), .55, 1);
  const speed = (hurry ? 4.4 : 2.7) * weight;
  if (inp.lengthSq() > 0) inp.normalize().multiplyScalar(speed);
  P.vel.lerp(inp, 1 - Math.exp(-dt * 9));
  const moving = P.vel.lengthSq() > .2;
  if (!P.sitting) {
    P.pos.addScaledVector(P.vel, dt); collidePlayer(P.pos, .34);
    const sp = P.vel.length(); P.bob += sp * dt * 2.15;
    P.stepAcc += sp * dt; if (P.stepAcc > .78) { P.stepAcc = 0; AUD.step(P.zone === 'warehouse'); }
    P.gy = lerp(P.gy, groundY(P.pos), 1 - Math.exp(-dt * 12));
    const bobA = Math.min(1, sp / 3) * (hurry ? 1.3 : 1);
    camera.position.set(P.pos.x + right.x * Math.cos(P.bob) * .018 * bobA, P.gy + 1.62 + Math.abs(Math.sin(P.bob)) * .045 * bobA, P.pos.z + right.z * Math.cos(P.bob) * .018 * bobA);
  } else {
    const s = P.sitting; const target = new THREE.Vector3(s.pos.x, s.pos.y + .62, s.pos.z);
    camera.position.lerp(target, 1 - Math.exp(-dt * 5));
  }
  camera.rotation.set(P.pitch, P.yaw, Math.sin(P.bob * .5) * .004);
  // viewmodel sway
  view.position.set(Math.cos(P.bob) * .01, -Math.abs(Math.sin(P.bob)) * .014 + (P.sitting ? -.25 : 0), 0);
  return { moving, hurry };
}

/* title-screen camera drift */
function attract(t) {
  const x = cc(2) + Math.sin(t * .05) * 4, z = cc(2) + .4;
  camera.position.set(x, 1.6, z); camera.rotation.set(-.04, -PI / 2 + Math.sin(t * .07) * .9 + .6, 0);
}

/* =========================================================
   main loop
   ========================================================= */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, clock.getDelta()); gameTime += dt;
  if (state === 'title' || state === 'loading' || state === 'intro') { if (state !== 'intro') attract(gameTime); else { camera.position.set(P.pos.x, 1.62, P.pos.z); camera.rotation.set(0, P.yaw, 0); } }
  if (state === 'play') {
    const { moving, hurry } = updatePlayer(dt);
    if (!P.locked) {
      currentInter = P.sitting ? null : findInteract(); promptFor(currentInter);
      updateTemptation(dt); updateShortcuts(); updateTriggers(); updateResolve(dt, moving, hurry);
      // PA
      flags.paT = (flags.paT ?? 25) - dt;
      if (flags.paT <= 0) { flags.paT = 55 + Math.random() * 45; const tier = uncanny > .62 ? 2 : uncanny > .3 ? 1 : 0; pa(pick(PA_LINES[tier])); }
    } else { setPrompt(); callLevel = 0; }
    updateUncanny(dt);
    const f = $('#barfill'), dash = `${clamp(P.resolve, 0, 100).toFixed(1)} 100`;
    if (f._d !== dash) { f._d = dash; f.setAttribute('stroke-dasharray', dash); f.setAttribute('stroke', P.resolve < 25 ? '#ff7a5c' : '#ffd43b'); }
  }
  if (state === 'play' || state === 'ended') updateThought(dt);
  if (paTimer > 0) { paTimer -= dt; if (paTimer <= 0) $('#pa').classList.remove('on'); }
  if (state !== 'loading') updatePool(dt);
  if (WH && WH.dustMat) WH.dustMat.uniforms.uTime.value = gameTime;
  AUD.update(dt, state === 'play' ? callLevel : 0);
  // post
  FX.uFade.value += clamp(fadeTarget - FX.uFade.value, -fadeSpeed * dt, fadeSpeed * dt);
  const low = 1 - clamp(P.resolve, 0, 100) / 100;
  FX.uTime.value = gameTime; FX.uSat.value = 1 - .65 * Math.pow(low, 1.4); FX.uVig.value = .45 + low * .5 + uncanny * .2;
  FX.uAb.value = .0015 + uncanny * .006 + low * .004; FX.uWarp.value = uncanny > .5 ? (uncanny - .5) * .05 : 0;
  composer.render();
}

/* =========================================================
   boot
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  FX.uRes.value.set(innerWidth, innerHeight); if (WH) WH.dustMat.uniforms.uScale.value = innerHeight / 900;
});
async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load(`800 40px Jost`), document.fonts.load(`500 40px Jost`)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  SR = buildShowroom();
  WH = buildWarehouse();
  buildBlobs('showroom', showroom); buildBlobs('warehouse', warehouse);
  // interactables in showroom specials
  const lr = ROOMS.find(r => r.lamp);
  INTER.push({ zone: 'showroom', pos: lr.tag, r: .2, reach: 2.4, kind: 'tag' });
  INTER.push({ zone: 'showroom', pos: lr.gloda, r: .25, reach: 2.6, kind: 'display' });
  INTER.push({ zone: 'showroom', pos: SR.staff.pos, r: .6, reach: 2.4, kind: 'staff' });
  ROOMS.forEach((r, i) => { if (rng() < .7) r.uncannyStory = UNCANNY_STORIES[i % UNCANNY_STORIES.length]; });
  buildGrid();
  setZone('showroom');
  fadeTo(0, 0x000000, 1.5);
  state = 'title';
  // compile warehouse shaders now to avoid a hitch later
  warehouse.visible = true; renderer.compile(scene, camera); warehouse.visible = false;
  const btn = $('#enter'); btn.disabled = false; btn.textContent = 'Enter the store'; btn.focus();
  try { const f = JSON.parse(localStorage.getItem('ywnli_endings') || '[]'); if (f.length) $('#found').textContent = `Endings found: ${f.length} / 5`; } catch (e) { }
  window.__game = { renderer, P, ROOMS, TARGET, SR, WH, setZone, ending, camera, INTER, FX, fadeTo, flags, think, liveHere, get state() { return state; } };
}
$('#enter').addEventListener('click', () => { if (state === 'title') startGame(); });
frame();
boot().catch(err => { console.error(err); $('#loadnote').textContent = 'Something went wrong while unfolding the store: ' + err.message; });
</script>
